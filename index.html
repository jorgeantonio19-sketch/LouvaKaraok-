<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê Offline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎤 LouvaKaraokê</h1>

    <input type="file" id="arquivo" accept="audio/*,video/*">

    <p id="nomeMusica">
        Nenhuma música selecionada
    </p>

    <video id="player" controls playsinline></video>

    <button id="play">▶ Play</button>
    <button id="pause">⏸ Pause</button>
    <button id="remover">🎙️ Ativar Efeito</button>

    <div class="controle">
        <label for="intensidade">Intensidade da remoção: <span id="valorIntensidade">0%</span></label>
        <input type="range" id="intensidade" min="0" max="100" value="0" disabled>
    </div>

    <div class="controle">
        <label for="graves">Proteger graves até: <span id="valorGraves">120 Hz</span></label>
        <input type="range" id="graves" min="0" max="500" value="120" disabled>
    </div>

    <a id="download" style="display:none">⬇ Baixar sem voz</a>

    <hr>

    <h3>🎤 Cantar Junto</h3>
    <p class="dica">Dica: usa fones de ouvido, senão a música vai pegar no microfone junto com tua voz.</p>

    <button id="gravar">🔴 Gravar minha voz</button>
    <button id="pararGravacao" disabled>⏹ Parar Gravação</button>

    <audio id="playerGravacao" controls style="display:none;"></audio>
    <a id="baixarGravacao" style="display:none">⬇ Baixar minha gravação</a>

<p id="status">Status: Pronto.</p></div>

<script src="script.js"></script>

</body>
</html>
